[versions]
agp = "8.13.2"
kotlin = "2.2.21"
compose-bom = "2025.10.01"
activity = "1.11.0"
lifecycle = "2.9.4"
junit = "4.13.2"
maps-compose = "6.7.1"
play-location = "21.3.0"
coroutines = "1.10.2"
android-test = "1.2.1"
test-runner = "1.6.2"
fragment = "1.8.9"
# BoM 35.1.0 selects Auth 25.0.0 with Kotlin 2.4 metadata; retain the Kotlin 2.2 toolchain.
firebase-bom = "34.19.0"
google-services = "4.5.0"

[libraries]
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-functions = { module = "com.google.firebase:firebase-functions" }
androidx-compose-ui-test = { module = "androidx.compose.ui:ui-test-junit4" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }
firebase-firestore = { module = "com.google.firebase:firebase-firestore" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
junit = { module = "junit:junit", version.ref = "junit" }
maps-compose = { module = "com.google.maps.android:maps-compose", version.ref = "maps-compose" }
play-location = { module = "com.google.android.gms:play-services-location", version.ref = "play-location" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "android-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "test-runner" }
androidx-fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

[plugins]
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
